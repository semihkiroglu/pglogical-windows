# release.yml — builds and publishes Windows x64 packages for one
# upstream pglogical release, across all supported PostgreSQL majors.
# The resolve job produces ONE validated plan (a matrix of complete plan
# entries: pglogical version, upstream tag + commit SHA, PostgreSQL
# major/minor, Windows packaging revision, and the EXACT pinned EDB artifact
# identity). Builds link against the pinned artifact; the release body
# records its filename, URL, and the calculated post-download SHA-256.
#
# Pinned-plan mode (preferred, used by upstream-watch): a planJson input is
# validated entry-by-entry and the pinned EDB URLs are verified available —
# no discovery happens inside the build, so a newer EDB revision appearing
# after planning can never replace the pinned artifact.
# Discovery mode (manual dispatch without planJson): the exact EDB artifact
# is resolved with the hardened probe (full bounded revision scan, fail
# closed on ambiguity) and the same entry structure is produced.
#
# All matrix build jobs must succeed before any publish job starts
# (publish `needs: build`). Publish jobs run per-major in parallel, so a
# failure during a publish step can leave a partial set of published
# releases; the report-failure job then opens an issue.
#
# Least-privilege permissions: contents: read everywhere except the publish
# job, which needs contents: write for the release itself.

name: release

on:
  workflow_dispatch:
    inputs:
      planJson:
        description: 'Pinned release plan (JSON array of plan entries). When supplied, no discovery happens: every entry is validated and the exact pinned EDB artifact is used. When empty, discovery mode resolves the upstream tag + exact EDB artifacts.'
        required: false
        type: string
        default: ''
      upstreamTag:
        description: 'Upstream pglogical release tag (discovery mode; defaults to the releaseBaseline from .github/pg-versions.json when empty)'
        required: false
        type: string
        default: ''
      packagingRevision:
        description: 'Packaging revision for discovery mode, e.g. 1 (windows.1). Ignored when planJson is supplied.'
        required: false
        type: number
        default: 1
      postgresMajors:
        description: 'Comma-separated PostgreSQL majors (discovery mode; default: all configured majors supported by the release)'
        required: false
        type: string
        default: ''
      dryRun:
        description: 'Build and test only; do not create or publish a release'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      planJson:
        description: 'Pinned release plan (JSON array of plan entries) produced by upstream-watch'
        required: false
        type: string
        default: ''
      dryRun:
        required: false
        type: boolean
        default: false
    # No repository secrets are used by this workflow; GITHUB_TOKEN is
    # sufficient for release publication, so no secrets are declared here.

# Per-major concurrency lives at job level (matrix context is not
# available in a top-level concurrency group). Without the pgMajor
# suffix, all five majors share one group and GitHub cancels queued runs
# when a new dispatch arrives — exactly one release would ever publish.

# No top-level `permissions` key: when this workflow is invoked as a reusable
# workflow, GitHub resolves permissions from the caller. Job-level permissions
# below keep the least-privilege model (contents: write only in publish).

jobs:
  resolve:
    name: Resolve and validate release plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commitSha: ${{ steps.resolve.outputs.commitSha }}
      upstreamTag: ${{ steps.resolve.outputs.upstreamTag }}
      planEntriesJson: ${{ steps.resolve.outputs.planEntriesJson }}
      majorsJson: ${{ steps.resolve.outputs.majorsJson }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve release, commit SHA, and plan entries
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ inputs.planJson }}
        run: |
          . ./scripts/common.ps1
          $config = Import-VersionConfig
          $repo = Get-UpstreamRepository
          $planJson = $env:PLAN_JSON

          if ($planJson) {
            # -----------------------------------------------------------------
            # Pinned-plan mode: validate the whole plan BEFORE any build,
            # verify every pinned EDB URL is still conclusively available,
            # and build with the exact pinned identities. No re-discovery.
            # -----------------------------------------------------------------
            $entries = @(Test-ReleasePlan -PlanJson $planJson)
            foreach ($e in $entries) {
              $null = Test-PinnedEdbUrl -Entry $e
            }
            $version = [string]$entries[0].pglogicalVersion
            $tag = [string]$entries[0].upstreamTag
            $commitSha = [string]$entries[0].upstreamCommitSha
            $majors = @($entries | ForEach-Object { [string]$_.postgresqlMajor } | Sort-Object { [int]$_ })
            Write-Host "Pinned plan validated: $($entries.Count) entries (PostgreSQL $($majors -join ', '))"
            $planEntriesJson = @($entries) | ConvertTo-Json -Compress -Depth 6
            "version=$version" >> $env:GITHUB_OUTPUT
            "commitSha=$commitSha" >> $env:GITHUB_OUTPUT
            "upstreamTag=$tag" >> $env:GITHUB_OUTPUT
            "planEntriesJson=$planEntriesJson" >> $env:GITHUB_OUTPUT
            $majorsJson = $majors | ConvertTo-Json -Compress -AsArray
            "majorsJson=$majorsJson" >> $env:GITHUB_OUTPUT
          }
          else {
            # -----------------------------------------------------------------
            # Discovery mode (manual dispatch): resolve upstream tag/commit,
            # feasible majors, and the exact EDB artifact for every major
            # using the hardened probe. Produces the same plan-entry shape.
            # -----------------------------------------------------------------
            $tag = '${{ inputs.upstreamTag }}'
            if (-not $tag) { $tag = ConvertFrom-PgLogicalVersion -Version $config.releaseBaseline }
            $pattern = [regex](Get-UpstreamTagPattern)
            if (-not $pattern.IsMatch($tag)) {
              throw "Tag '$tag' does not match the upstream release pattern $(Get-UpstreamTagPattern)"
            }
            $version = ConvertTo-PgLogicalVersion -Tag $tag
            if ([version]$version -lt [version]$config.releaseBaseline) {
              throw "Version $version is below the configured baseline $($config.releaseBaseline); not packaging."
            }

            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers (Get-GitHubHeaders) -Method Get
            if ($release.draft -or $release.prerelease) {
              throw "Upstream release $tag is a draft or prerelease; refusing to package it."
            }
            $ref = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/tags/$tag" -Headers (Get-GitHubHeaders) -Method Get
            if ($ref.object.type -eq 'tag') {
              $tagObj = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/tags/$($ref.object.sha)" -Headers (Get-GitHubHeaders) -Method Get
              $commitSha = $tagObj.object.sha
            } else {
              $commitSha = $ref.object.sha
            }
            Write-Host "Upstream $tag ($version) @ $commitSha"

            # Determine feasible majors: configured majors ∩ upstream compat dirs.
            git clone --quiet --depth 1 --branch $tag "https://github.com/$repo.git" upstream
            $compatDirs = @(Get-ChildItem upstream -Directory -Filter 'compat*' | ForEach-Object {
              if ($_.Name -match '^compat([0-9]+)$') { $matches[1] }
            } | Sort-Object { [int]$_ })
            $configured = @($config.postgresqlMajors | ForEach-Object { [string]$_ })
            $requested = @()
            if ('${{ inputs.postgresMajors }}') {
              $requested = @('${{ inputs.postgresMajors }}'.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            }
            $configuredFeasible = @($configured | Where-Object { $compatDirs -contains $_ })
            $skipped = @($configured | Where-Object { $compatDirs -notcontains $_ })
            $unknownRequested = @($requested | Where-Object { $configured -notcontains $_ })
            $majors = if ($requested.Count -gt 0) {
              @($configuredFeasible | Where-Object { $requested -contains $_ })
            } else {
              $configuredFeasible
            }
            $majors = @($majors | Sort-Object { [int]$_ })
            if ($skipped.Count -gt 0) { Write-Host "Skipped (no upstream compat dir; feasibility only): $($skipped -join ', ')" }
            if ($unknownRequested.Count -gt 0) { Write-Host "Ignored unconfigured requested majors: $($unknownRequested -join ', ')" }

            $revision = [int]'${{ inputs.packagingRevision }}'
            if ($revision -lt 1) { $revision = 1 }

            $entries = @()
            foreach ($m in $majors) {
              $artifact = Resolve-EdbArtifact -Major $m
              if (-not $artifact) {
                throw "Cannot resolve the exact EDB Windows x64 binaries artifact for PostgreSQL $m; refusing to build (fail closed)."
              }
              $entries += [pscustomobject]@{
                pglogicalVersion         = $version
                upstreamTag              = $tag
                upstreamCommitSha        = $commitSha
                postgresqlMajor          = $m
                postgresqlMinor          = $artifact.minor
                postgresqlBuildVersion   = "$($artifact.major).$($artifact.minor)"
                windowsPackagingRevision = $revision
                edbPackagingRevision     = $artifact.revision
                edbArtifactFilename      = $artifact.filename
                edbArtifactUrl           = $artifact.url
                localTag                 = Get-LocalReleaseTag -Version $version -PackagingRevision $revision -PgMajor $m
              }
              Write-Host "PG $m exact EDB artifact: $($artifact.filename)"
            }
            $planEntriesJson = if ($entries.Count -gt 0) { @($entries) | ConvertTo-Json -Compress -Depth 6 } else { '[]' }
            $majorsJson = if ($majors.Count -gt 0) { $majors | ConvertTo-Json -Compress -AsArray } else { '[]' }
            "version=$version" >> $env:GITHUB_OUTPUT
            "commitSha=$commitSha" >> $env:GITHUB_OUTPUT
            "upstreamTag=$tag" >> $env:GITHUB_OUTPUT
            "planEntriesJson=$planEntriesJson" >> $env:GITHUB_OUTPUT
            "majorsJson=$majorsJson" >> $env:GITHUB_OUTPUT
          }

  build:
    name: Build + smoke test (PostgreSQL ${{ matrix.entry.postgresqlMajor }})
    needs: resolve
    if: ${{ needs.resolve.outputs.planEntriesJson != '[]' }}
    runs-on: windows-2022
    permissions:
      contents: read
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}-pg${{ matrix.entry.postgresqlMajor }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.resolve.outputs.planEntriesJson) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache PostgreSQL binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pg-cache
          # The cache key includes the exact EDB artifact filename so a
          # different packaging revision can never reuse the wrong cached ZIP.
          key: pg-binaries-${{ matrix.entry.postgresqlMajor }}-${{ matrix.entry.edbArtifactFilename }}

      - name: Install official PostgreSQL ${{ matrix.entry.postgresqlMajor }}
        id: install
        shell: pwsh
        env:
          EDB_MINOR: ${{ matrix.entry.postgresqlMinor }}
          EDB_URL: ${{ matrix.entry.edbArtifactUrl }}
        run: |
          $pgRoot = & ./scripts/Install-PostgreSql.ps1 -Major ${{ matrix.entry.postgresqlMajor }} -Minor $env:EDB_MINOR -BinariesUrl $env:EDB_URL
          "pgRoot=$pgRoot" >> $env:GITHUB_OUTPUT

      - name: Clone upstream tag
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          $repo = Get-UpstreamRepository
          $tag = '${{ needs.resolve.outputs.upstreamTag }}'
          $src = ".build/$tag/upstream"
          if (-not (Test-Path $src)) {
            New-Item -ItemType Directory -Force -Path ".build/$tag" | Out-Null
            git clone --quiet --depth 1 --branch $tag "https://github.com/$repo.git" $src
          }
          Write-Host "Upstream checkout at: $src"

      - name: Build with CMake + MSVC
        id: build
        shell: pwsh
        timeout-minutes: 30
        run: |
          $src = ".build/${{ needs.resolve.outputs.upstreamTag }}/upstream"
          $stage = & ./scripts/Build-PgLogical.ps1 `
            -PgRoot "${{ steps.install.outputs.pgRoot }}" `
            -UpstreamTag "${{ needs.resolve.outputs.upstreamTag }}" `
            -ExpectedCommitSha "${{ needs.resolve.outputs.commitSha }}" `
            -SourceDir $src `
            -SkipClone `
            -OutputStaging
          if (-not $stage) { throw "Build-PgLogical produced no staging dir" }
          "stage=$stage" >> $env:GITHUB_OUTPUT
          # The subscriber utility must be fully independent of postgres.exe
          # (loading postgres.exe as a DLL into the utility process crashes
          # with access violations). Verify the import table.
          $msvcRoot = Join-Path ${env:ProgramFiles} 'Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC'
          $dumpbin = Get-ChildItem -Path $msvcRoot -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { $dumpbin = Get-ChildItem -Path $msvcRoot -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          & $dumpbin.FullName /imports (Join-Path $stage 'bin\pglogical_create_subscriber.exe') | Out-String | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'subscriber-imports.txt')
          $imports = Get-Content (Join-Path $env:RUNNER_TEMP 'subscriber-imports.txt') -Raw
          Write-Host "Subscriber imports postgres.exe: $($imports -match 'postgres\.exe')"
          & $dumpbin.FullName /imports "${{ steps.install.outputs.pgRoot }}\bin\postgres.exe" | Out-String | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'postgres-imports.txt')
          $pgImports = Get-Content (Join-Path $env:RUNNER_TEMP 'postgres-imports.txt') -Raw
          Write-Host "postgres.exe imports pglogical.dll: $($pgImports -match 'pglogical\.dll')"
          & $dumpbin.FullName /exports (Join-Path $stage 'lib\pglogical.dll') | Out-String | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'pgl-exports.txt')
          $exports = Get-Content (Join-Path $env:RUNNER_TEMP 'pgl-exports.txt') | Where-Object { $_ -match '^\s+\d+\s+[0-9A-F]{1,8}\s+[0-9A-F]{8}\s+\S' } | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-F]{1,8}\s+([0-9A-F]{8})\s+(\S+)') { [pscustomobject]@{ RVA = [Convert]::ToUInt32($matches[1], 16); Name = $matches[2] } }
          }
          $crashRva = 0x1fe58
          $hit = $exports | Where-Object { $_.RVA -le $crashRva } | Sort-Object RVA -Descending | Select-Object -First 1
          $next = $exports | Where-Object { $_.RVA -gt $crashRva } | Sort-Object RVA | Select-Object -First 1
          Write-Host "pglogical.dll crash offset 0x1fe58 maps to function: $($hit.Name) (RVA 0x$('{0:X}' -f $hit.RVA))"
          if ($next) { Write-Host "  next export: $($next.Name) (RVA 0x$('{0:X}' -f $next.RVA)); offset into function: 0x$('{0:X}' -f ($crashRva - $hit.RVA))" }
          Write-Host "  all exports:"; $exports | ForEach-Object { Write-Host "    $('0x{0:X}' -f $_.RVA) $($_.Name)" }
          if ($imports -match 'postgres\.exe') {
            $imports | Select-String -Pattern 'postgres\.exe|^\s+[0-9A-F]+\s+\w' | Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
            Write-Host "WARNING: pglogical_create_subscriber.exe still imports postgres.exe (temporarily non-fatal while crash location is diagnosed)"
          }

      - name: Smoke test
        shell: pwsh
        timeout-minutes: 30
        run: |
          ./scripts/Test-PgLogical.ps1 `
            -PgRoot "${{ steps.install.outputs.pgRoot }}" `
            -StagingDir "${{ steps.build.outputs.stage }}" `
            -UpstreamVersion "${{ needs.resolve.outputs.version }}" `
            -AllowTemporaryLocalUser

      - name: Record EDB artifact SHA-256 and package ZIP
        id: package
        shell: pwsh
        timeout-minutes: 10
        env:
          ENTRY_JSON: ${{ toJson(matrix.entry) }}
        run: |
          $entry = $env:ENTRY_JSON | ConvertFrom-Json
          # The pinned EDB archive must be in the cache (downloaded by the
          # install step under its exact filename); its SHA-256 is calculated
          # by this project — never a vendor-published checksum.
          $artifactFile = [string]$entry.edbArtifactFilename
          $zip = Get-ChildItem .pg-cache -Filter $artifactFile -File | Select-Object -First 1
          if (-not $zip) { throw "Pinned EDB artifact not found in .pg-cache: $artifactFile" }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $pkgDir = "${{ runner.temp }}/pkg"
          $null = New-Item -ItemType Directory -Force -Path $pkgDir
          $recordFile = Join-Path $pkgDir 'edb-artifact.txt'
          "$hash  $artifactFile" | Set-Content -Path $recordFile -Encoding ascii
          Write-Host "EDB artifact SHA-256 (calculated post-download): $hash ($artifactFile)"

          $zipOut = & ./scripts/Package-PgLogical.ps1 `
            -StagingDir "${{ steps.build.outputs.stage }}" `
            -SourceDir ".build/${{ needs.resolve.outputs.upstreamTag }}/upstream" `
            -PlanEntry $entry `
            -EdbArtifactCalculatedSha256 $hash `
            -OutputDir $pkgDir
          if (-not $zipOut) { throw "Package-PgLogical produced no zip" }
          "zip=$zipOut" >> $env:GITHUB_OUTPUT
          "pkgDir=$pkgDir" >> $env:GITHUB_OUTPUT

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-pg${{ matrix.entry.postgresqlMajor }}
          path: |
            ${{ runner.temp }}/pkg/*.zip
            ${{ runner.temp }}/pkg/SHA256SUMS.txt
            ${{ runner.temp }}/pkg/edb-artifact.txt
          if-no-files-found: error

  publish:
    name: Publish release (PostgreSQL ${{ matrix.entry.postgresqlMajor }})
    needs: [resolve, build]
    if: ${{ !inputs.dryRun && needs.resolve.outputs.planEntriesJson != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}-pg${{ matrix.entry.postgresqlMajor }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.resolve.outputs.planEntriesJson) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compute release tag for this PG major
        id: tag
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          $tag = Get-LocalReleaseTag `
            -Version '${{ needs.resolve.outputs.version }}' `
            -PackagingRevision ([int]'${{ matrix.entry.windowsPackagingRevision }}') `
            -PgMajor '${{ matrix.entry.postgresqlMajor }}'
          "releaseTag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: packages-pg${{ matrix.entry.postgresqlMajor }}
          path: artifacts
          merge-multiple: true

      - name: Verify package checksum
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          $zips = @(Get-ChildItem artifacts -Filter '*.zip' -File)
          if ($zips.Count -ne 1) {
            throw "Expected exactly 1 package ZIP for PG ${{ matrix.entry.postgresqlMajor }} but found $($zips.Count): $($zips.Name -join ', ')"
          }
          $expectedName = (Get-PackageZipName `
            -PglogicalVersion '${{ needs.resolve.outputs.version }}' `
            -PostgresqlMajor '${{ matrix.entry.postgresqlMajor }}' `
            -PostgresqlMinor '${{ matrix.entry.postgresqlMinor }}' `
            -EdbPackagingRevision ([int]'${{ matrix.entry.edbPackagingRevision }}'))
          if ($zips[0].Name -ne $expectedName) {
            throw "Packaged ZIP name '$($zips[0].Name)' does not match the exact-version name '$expectedName'"
          }
          $sums = @(Get-ChildItem artifacts -Filter 'SHA256SUMS.txt' -File | ForEach-Object { Get-Content $_.FullName })
          foreach ($zip in $zips) {
            $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = $sums | Where-Object { $_ -like "*$($zip.Name)" }
            if (-not $line) { throw "No checksum line for $($zip.Name)" }
            if (($line -split '\s+')[0] -ne $actual) { throw "Checksum mismatch for $($zip.Name)" }
            Write-Host "OK: $($zip.Name) matches SHA256 $actual"
          }
          $sums | Set-Content -Path artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt

      - name: Check for an existing release (fail closed)
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/common.ps1
          $tag = '${{ steps.tag.outputs.releaseTag }}'
          $state = Test-ExistingRelease -Tag $tag -Repository $env:GITHUB_REPOSITORY
          if ($state -eq 'absent') {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag does not exist; publication will proceed."
          } else {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; skipping creation (idempotent no-op)."
          }

      - name: Generate release body
        id: body
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          $upstreamRepo = Get-UpstreamRepository
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $checksums = (Get-Content artifacts/SHA256SUMS.txt) -join "`n"
          $edbRecord = if (Test-Path artifacts/edb-artifact.txt) { (Get-Content artifacts/edb-artifact.txt -Raw).Trim() } else { '' }
          if (-not $edbRecord) { throw 'Missing edb-artifact.txt; cannot record EDB artifact provenance in the release body.' }
          $edbParts = $edbRecord -split '\s+', 2
          $edbHash = $edbParts[0].Trim()
          $edbArchive = $edbParts[1].Trim()
          if (-not $edbHash -or -not $edbArchive) { throw "Malformed edb-artifact.txt: '$edbRecord'" }

          $template = Get-Content .github/release-body-template.md -Raw
          $body = $template.Replace('{{VERSION}}', '${{ needs.resolve.outputs.version }}')
          $body = $body.Replace('{{UPSTREAM_REPO}}', $upstreamRepo)
          $body = $body.Replace('{{UPSTREAM_TAG}}', '${{ needs.resolve.outputs.upstreamTag }}')
          $body = $body.Replace('{{COMMIT_SHA}}', '${{ needs.resolve.outputs.commitSha }}')
          $body = $body.Replace('{{PACKAGING_REVISION}}', '${{ matrix.entry.windowsPackagingRevision }}')
          $body = $body.Replace('{{PG_MAJOR}}', '${{ matrix.entry.postgresqlMajor }}')
          $body = $body.Replace('{{PG_MINOR}}', '${{ matrix.entry.postgresqlMinor }}')
          $body = $body.Replace('{{PG_BUILD_VERSION}}', '${{ matrix.entry.postgresqlBuildVersion }}')
          $body = $body.Replace('{{EDB_REVISION}}', '${{ matrix.entry.edbPackagingRevision }}')
          $body = $body.Replace('{{EDB_ARCHIVE}}', $edbArchive)
          $body = $body.Replace('{{EDB_URL}}', '${{ matrix.entry.edbArtifactUrl }}')
          $body = $body.Replace('{{EDB_BINARIES_SHA256}}', $edbHash)
          $body = $body.Replace('{{RUN_URL}}', $runUrl)
          $body = $body.Replace('{{CHECKSUMS}}', $checksums)
          $body | Set-Content -Path release-body.md -Encoding utf8
          "bodyFile=$env:GITHUB_WORKSPACE/release-body.md" >> $env:GITHUB_OUTPUT

      - name: Create release tag
        # GitHub no longer creates a git tag when a draft release is created;
        # the rest of this job resolves releases by tag, so create the tag
        # explicitly first. 422 (already exists) is fine.
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.releaseTag }}"
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Tag $tag already exists or could not be created; continuing."
          fi

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = '${{ steps.tag.outputs.releaseTag }}'
          # NOTE: no --draft. GitHub's "get release by tag" endpoint does not
          # return draft releases (drafts no longer get a git tag link), which
          # breaks every tag-based step that follows. Create the release
          # directly; the ownership-checked cleanup step still removes it on
          # failure.
          gh release create $releaseTag --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "pglogical $('${{ needs.resolve.outputs.version }}') — PostgreSQL ${{ matrix.entry.postgresqlMajor }} (built against ${{ matrix.entry.postgresqlBuildVersion }}, EDB revision ${{ matrix.entry.edbPackagingRevision }}) — windows.$('${{ matrix.entry.windowsPackagingRevision }}')" `
            --notes-file release-body.md

      - name: Capture created release identity
        if: steps.existing.outputs.exists == 'false'
        id: created
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.releaseTag }}'
          $id = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id'
          if ($LASTEXITCODE -ne 0 -or -not $id) { throw "Could not resolve the release ID for $tag after release creation." }
          "created=true" >> $env:GITHUB_OUTPUT
          "releaseId=$id" >> $env:GITHUB_OUTPUT
          Write-Host "Captured created release identity: $tag (id $id)"

      - name: Upload release assets
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.releaseTag }}"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" artifacts/*.zip artifacts/SHA256SUMS.txt
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: Generate artifact attestation
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: artifacts/*.zip

      - name: Verify release is published
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          isDraft=$(gh release view "${{ steps.tag.outputs.releaseTag }}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          echo "isDraft=$isDraft"
          if [ "$isDraft" != "false" ]; then echo "Release is still a draft"; exit 1; fi

      - name: Delete incomplete release on failure (ownership-checked)
        if: ${{ failure() && steps.existing.outputs.exists == 'false' && steps.created.outputs.created == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/common.ps1
          $tag = '${{ steps.tag.outputs.releaseTag }}'
          $releaseId = '${{ steps.created.outputs.releaseId }}'
          if (-not (Test-ReleaseOwnership -Created '${{ steps.created.outputs.created }}' -ReleaseId $releaseId -Tag $tag -Repository $env:GITHUB_REPOSITORY)) {
            Write-Host "Cleanup ownership cannot be proven for $tag (releaseId '$releaseId'); leaving the release and tag untouched."
            exit 1
          }
          gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
          if ($LASTEXITCODE -ne 0) { throw "Failed to delete incomplete draft release $tag (id $releaseId)." }
          # Remove the tag only for the incomplete release created by this
          # job (ownership verified above). A missing ref is fine.
          $refDelete = & gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" --silent 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "Tag ref cleanup skipped (exit $LASTEXITCODE): $refDelete" }
          Write-Host "Deleted incomplete draft release $tag (id $releaseId) created by this job."

  set-latest:
    # GitHub allows exactly ONE "Latest" release per repository. Parallel
    # matrix publishes make the winner nondeterministic (last finisher), so
    # after the whole batch succeeds, deterministically select Latest from
    # ALL published releases for this pglogical version (not only this run's
    # change set) and mark it.
    name: Mark deterministic GitHub Latest
    needs: [resolve, publish]
    if: ${{ !inputs.dryRun && needs.resolve.outputs.planEntriesJson != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reconcile Latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          $config = Import-VersionConfig
          $majors = @($config.postgresqlMajors | ForEach-Object { [string]$_ })
          # gh api --jq emits one JSON document per release; ConvertFrom-Json
          # turns the stream into release objects before selection.
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[] | {tag_name, draft, prerelease}' | ConvertFrom-Json)
          $tag = Select-LatestRelease -Version $env:VERSION -Majors $majors -Releases $releases
          if (-not $tag) { throw "No published release found for pglogical $env:VERSION; cannot select Latest." }
          $releaseId = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id'
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -f make_latest=true
          Write-Host "Marked $tag as the latest release"

  report-failure:
    name: Report build failure
    needs: [resolve, build, publish]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Checkout
        # gh issue create requires a git repository context even with --repo.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Open issue for failed build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ needs.resolve.outputs.version }}'
          $tag = '${{ needs.resolve.outputs.upstreamTag }}'
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @(
            "Build for pglogical $version ($tag) failed."
            ""
            "Workflow run: $runUrl"
          ) -join "`n"
          gh issue create --repo "$GITHUB_REPOSITORY" `
            --title "Build failed for pglogical $version ($tag)" `
            --body "$body"
