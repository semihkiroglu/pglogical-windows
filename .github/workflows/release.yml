# release.yml — builds and publishes one Windows x64 release for one
# upstream pglogical revision across all supported PostgreSQL majors.
# The resolve job produces ONE validated plan (a matrix of complete plan
# entries: pglogical version, upstream tag + commit SHA, PostgreSQL
# major/minor, Windows packaging revision, and the EXACT pinned EDB artifact
# identity). Builds link against the pinned artifact; the single release body
# records provenance for every package and the calculated post-download
# SHA-256 values.
#
# Pinned-plan mode (preferred, used by upstream-watch): a planJson input is
# validated entry-by-entry and the pinned EDB URLs are verified available —
# no discovery happens inside the build, so a newer EDB revision appearing
# after planning can never replace the pinned artifact.
# Discovery mode (manual dispatch without planJson): the exact EDB artifact
# is resolved with the hardened probe and the same entry structure is produced.
#
# All matrix build jobs must succeed before the ONE publish job starts
# (publish `needs: build`). The publish job downloads every major package,
# creates one release tag (`<version>-w<revision>`), and attaches all ZIPs plus
# one combined SHA256SUMS.txt. This keeps GitHub Latest deterministic.
#
# Least-privilege permissions: contents: read everywhere except the publish
# job, which needs contents: write for the release itself.

name: release
run-name: release ${{ inputs.rebuildMarker || inputs.upstreamTag || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      planJson:
        description: 'Pinned release plan (JSON array of plan entries). When supplied, no discovery happens: every entry is validated and the exact pinned EDB artifact is used. When empty, discovery mode resolves the upstream tag + exact EDB artifacts.'
        required: false
        type: string
        default: ''
      upstreamTag:
        description: 'Upstream pglogical release tag (discovery mode; defaults to the releaseBaseline from .github/pg-versions.json when empty)'
        required: false
        type: string
        default: ''
      packagingRevision:
        description: 'Packaging revision for discovery mode, e.g. 1 (w1). Ignored when planJson is supplied.'
        required: false
        type: number
        default: 1
      postgresMajors:
        description: 'Comma-separated PostgreSQL majors (discovery mode; default: all configured majors supported by the release)'
        required: false
        type: string
        default: ''
      dryRun:
        description: 'Build and test only; do not create or publish a release'
        required: false
        type: boolean
        default: false
      rebuildMarker:
        description: 'Optional deterministic compatibility-rebuild marker used for dispatch deduplication.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      planJson:
        description: 'Pinned release plan (JSON array of plan entries) produced by upstream-watch'
        required: false
        type: string
        default: ''
      dryRun:
        required: false
        type: boolean
        default: false
    # No repository secrets are used by this workflow; GITHUB_TOKEN is
    # sufficient for release publication, so no secrets are declared here.

# All package builds for a release share one workflow-level identity. The
# publish job is deliberately single-instance: a matrix publish would create
# multiple immutable tags/releases and make Latest nondeterministic.

# No top-level `permissions` key: when this workflow is invoked as a reusable
# workflow, GitHub resolves permissions from the caller. Job-level permissions
# below keep the least-privilege model (contents: write only in publish).

jobs:
  resolve:
    name: Resolve and validate release plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commitSha: ${{ steps.resolve.outputs.commitSha }}
      upstreamTag: ${{ steps.resolve.outputs.upstreamTag }}
      planEntriesJson: ${{ steps.resolve.outputs.planEntriesJson }}
      majorsJson: ${{ steps.resolve.outputs.majorsJson }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve release, commit SHA, and plan entries
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ inputs.planJson }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstreamTag }}
          INPUT_PACKAGING_REVISION: ${{ inputs.packagingRevision }}
          INPUT_POSTGRES_MAJORS: ${{ inputs.postgresMajors }}
        run: |
          . ./scripts/common.ps1
          $config = Import-VersionConfig
          $repo = Get-UpstreamRepository
          $planJson = $env:PLAN_JSON

          if ($planJson) {
            # -----------------------------------------------------------------
            # Pinned-plan mode: validate the whole plan BEFORE any build,
            # verify every pinned EDB URL is still conclusively available,
            # and build with the exact pinned identities. No re-discovery.
            # -----------------------------------------------------------------
            $entries = @(Test-ReleasePlan -PlanJson $planJson)
            foreach ($e in $entries) {
              $null = Test-PinnedEdbUrl -Entry $e
            }
            $version = [string]$entries[0].pglogicalVersion
            $tag = [string]$entries[0].upstreamTag
            $commitSha = [string]$entries[0].upstreamCommitSha
            $majors = @($entries | ForEach-Object { [string]$_.postgresqlMajor } | Sort-Object { [int]$_ })
            Write-Host "Pinned plan validated: $($entries.Count) entries (PostgreSQL $($majors -join ', '))"
            $planEntriesJson = @($entries) | ConvertTo-Json -Compress -Depth 6 -AsArray
            "version=$version" >> $env:GITHUB_OUTPUT
            "commitSha=$commitSha" >> $env:GITHUB_OUTPUT
            "upstreamTag=$tag" >> $env:GITHUB_OUTPUT
            "planEntriesJson=$planEntriesJson" >> $env:GITHUB_OUTPUT
            $majorsJson = $majors | ConvertTo-Json -Compress -AsArray
            "majorsJson=$majorsJson" >> $env:GITHUB_OUTPUT
          }
          else {
            # -----------------------------------------------------------------
            # Discovery mode (manual dispatch): resolve upstream tag/commit,
            # feasible majors, and the exact EDB artifact for every major
            # using the hardened probe. Produces the same plan-entry shape.
            # -----------------------------------------------------------------
            $tag = $env:INPUT_UPSTREAM_TAG
            if (-not $tag) { $tag = ConvertFrom-PgLogicalVersion -Version $config.releaseBaseline }
            $pattern = [regex](Get-UpstreamTagPattern)
            if (-not $pattern.IsMatch($tag)) {
              throw "Tag '$tag' does not match the upstream release pattern $(Get-UpstreamTagPattern)"
            }
            $version = ConvertTo-PgLogicalVersion -Tag $tag
            if ([version]$version -lt [version]$config.releaseBaseline) {
              throw "Version $version is below the configured baseline $($config.releaseBaseline); not packaging."
            }

            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers (Get-GitHubHeaders) -Method Get
            if ($release.draft -or $release.prerelease) {
              throw "Upstream release $tag is a draft or prerelease; refusing to package it."
            }
            $ref = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/tags/$tag" -Headers (Get-GitHubHeaders) -Method Get
            if ($ref.object.type -eq 'tag') {
              $tagObj = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/tags/$($ref.object.sha)" -Headers (Get-GitHubHeaders) -Method Get
              $commitSha = $tagObj.object.sha
            } else {
              $commitSha = $ref.object.sha
            }
            Write-Host "Upstream $tag ($version) @ $commitSha"

            # Determine feasible majors: configured majors ∩ upstream compat dirs.
            git clone --quiet --depth 1 --branch $tag "https://github.com/$repo.git" upstream
            $compatDirs = @(Get-ChildItem upstream -Directory -Filter 'compat*' | ForEach-Object {
              if ($_.Name -match '^compat([0-9]+)$') { $matches[1] }
            } | Sort-Object { [int]$_ })
            $configured = @($config.postgresqlMajors | ForEach-Object { [string]$_ })
            $requested = @()
            if ($env:INPUT_POSTGRES_MAJORS) {
              $requested = @($env:INPUT_POSTGRES_MAJORS.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            }
            $configuredFeasible = @($configured | Where-Object { $compatDirs -contains $_ })
            $skipped = @($configured | Where-Object { $compatDirs -notcontains $_ })
            $unknownRequested = @($requested | Where-Object { $configured -notcontains $_ })
            $majors = if ($requested.Count -gt 0) {
              @($configuredFeasible | Where-Object { $requested -contains $_ })
            } else {
              $configuredFeasible
            }
            $majors = @($majors | Sort-Object { [int]$_ })
            if ($skipped.Count -gt 0) { Write-Host "Skipped (no upstream compat dir; feasibility only): $($skipped -join ', ')" }
            if ($unknownRequested.Count -gt 0) { Write-Host "Ignored unconfigured requested majors: $($unknownRequested -join ', ')" }

            $revision = [int]$env:INPUT_PACKAGING_REVISION
            if ($revision -lt 1) { $revision = 1 }

            $entries = @()
            foreach ($m in $majors) {
              $artifact = Resolve-EdbArtifact -Major $m
              if (-not $artifact) {
                throw "Cannot resolve the exact EDB Windows x64 binaries artifact for PostgreSQL $m; refusing to build (fail closed)."
              }
              $entries += [pscustomobject]@{
                pglogicalVersion         = $version
                upstreamTag              = $tag
                upstreamCommitSha        = $commitSha
                postgresqlMajor          = $m
                postgresqlMinor          = $artifact.minor
                postgresqlBuildVersion   = "$($artifact.major).$($artifact.minor)"
                windowsPackagingRevision = $revision
                edbPackagingRevision     = $artifact.revision
                edbArtifactFilename      = $artifact.filename
                edbArtifactUrl           = $artifact.url
                localTag                 = Get-LocalReleaseTag -Version $version -PackagingRevision $revision
              }
              Write-Host "PG $m exact EDB artifact: $($artifact.filename)"
            }
            $planEntriesJson = if ($entries.Count -gt 0) { @($entries) | ConvertTo-Json -Compress -Depth 6 -AsArray } else { '[]' }
            $majorsJson = if ($majors.Count -gt 0) { $majors | ConvertTo-Json -Compress -AsArray } else { '[]' }
            "version=$version" >> $env:GITHUB_OUTPUT
            "commitSha=$commitSha" >> $env:GITHUB_OUTPUT
            "upstreamTag=$tag" >> $env:GITHUB_OUTPUT
            "planEntriesJson=$planEntriesJson" >> $env:GITHUB_OUTPUT
            "majorsJson=$majorsJson" >> $env:GITHUB_OUTPUT
          }

  build:
    name: Build + smoke test (PostgreSQL ${{ matrix.entry.postgresqlMajor }})
    needs: resolve
    if: ${{ needs.resolve.outputs.planEntriesJson != '[]' }}
    runs-on: windows-2022
    permissions:
      contents: read
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}-pg${{ matrix.entry.postgresqlMajor }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.resolve.outputs.planEntriesJson) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache PostgreSQL binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pg-cache
          # The cache key includes the exact EDB artifact filename so a
          # different packaging revision can never reuse the wrong cached ZIP.
          key: pg-binaries-${{ matrix.entry.postgresqlMajor }}-${{ matrix.entry.edbArtifactFilename }}

      - name: Install official PostgreSQL ${{ matrix.entry.postgresqlMajor }}
        id: install
        shell: pwsh
        env:
          PG_MAJOR: ${{ matrix.entry.postgresqlMajor }}
          EDB_MINOR: ${{ matrix.entry.postgresqlMinor }}
          EDB_URL: ${{ matrix.entry.edbArtifactUrl }}
        run: |
          $pgRoot = & ./scripts/Install-PostgreSql.ps1 -Major $env:PG_MAJOR -Minor $env:EDB_MINOR -BinariesUrl $env:EDB_URL
          "pgRoot=$pgRoot" >> $env:GITHUB_OUTPUT

      - name: Clone upstream tag
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstreamTag }}
        run: |
          . ./scripts/common.ps1
          $repo = Get-UpstreamRepository
          $tag = $env:UPSTREAM_TAG
          $src = ".build/$tag/upstream"
          if (-not (Test-Path $src)) {
            New-Item -ItemType Directory -Force -Path ".build/$tag" | Out-Null
            git clone --quiet --depth 1 --branch $tag "https://github.com/$repo.git" $src
          }
          Write-Host "Upstream checkout at: $src"

      - name: Build with CMake + MSVC
        id: build
        shell: pwsh
        timeout-minutes: 30
        env:
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstreamTag }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commitSha }}
          PG_ROOT: ${{ steps.install.outputs.pgRoot }}
        run: |
          $src = ".build/$env:UPSTREAM_TAG/upstream"
          $stage = & ./scripts/Build-PgLogical.ps1 `
            -PgRoot $env:PG_ROOT `
            -UpstreamTag $env:UPSTREAM_TAG `
            -ExpectedCommitSha $env:COMMIT_SHA `
            -SourceDir $src `
            -SkipClone `
            -OutputStaging
          if (-not $stage) { throw "Build-PgLogical produced no staging dir" }
          "stage=$stage" >> $env:GITHUB_OUTPUT
          # The subscriber utility must be fully independent of postgres.exe
          # (loading postgres.exe as a DLL into the utility process crashes
          # with access violations). Verify the import table.
          $msvcRoot = Join-Path ${env:ProgramFiles} 'Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC'
          $dumpbin = Get-ChildItem -Path $msvcRoot -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { $dumpbin = Get-ChildItem -Path $msvcRoot -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          & $dumpbin.FullName /imports (Join-Path $stage 'bin\pglogical_create_subscriber.exe') | Out-String | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'subscriber-imports.txt')
          $imports = Get-Content (Join-Path $env:RUNNER_TEMP 'subscriber-imports.txt') -Raw
          Write-Host "Subscriber imports postgres.exe: $($imports -match 'postgres\.exe')"
          & $dumpbin.FullName /imports "$env:PG_ROOT\bin\postgres.exe" | Out-String | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'postgres-imports.txt')
          $pgImports = Get-Content (Join-Path $env:RUNNER_TEMP 'postgres-imports.txt') -Raw
          Write-Host "postgres.exe imports pglogical.dll: $($pgImports -match 'pglogical\.dll')"
          & $dumpbin.FullName /exports (Join-Path $stage 'lib\pglogical.dll') | Out-String | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'pgl-exports.txt')
          $exports = Get-Content (Join-Path $env:RUNNER_TEMP 'pgl-exports.txt') | Where-Object { $_ -match '^\s+\d+\s+[0-9A-F]{1,8}\s+[0-9A-F]{8}\s+\S' } | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-F]{1,8}\s+([0-9A-F]{8})\s+(\S+)') { [pscustomobject]@{ RVA = [Convert]::ToUInt32($matches[1], 16); Name = $matches[2] } }
          }
          $crashRva = 0x1fe58
          $hit = $exports | Where-Object { $_.RVA -le $crashRva } | Sort-Object RVA -Descending | Select-Object -First 1
          $next = $exports | Where-Object { $_.RVA -gt $crashRva } | Sort-Object RVA | Select-Object -First 1
          Write-Host "pglogical.dll crash offset 0x1fe58 maps to function: $($hit.Name) (RVA 0x$('{0:X}' -f $hit.RVA))"
          if ($next) { Write-Host "  next export: $($next.Name) (RVA 0x$('{0:X}' -f $next.RVA)); offset into function: 0x$('{0:X}' -f ($crashRva - $hit.RVA))" }
          Write-Host "  all exports:"; $exports | ForEach-Object { Write-Host "    $('0x{0:X}' -f $_.RVA) $($_.Name)" }
          if ($imports -match 'postgres\.exe') {
            $imports | Select-String -Pattern 'postgres\.exe|^\s+[0-9A-F]+\s+\w' | Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
            Write-Host "WARNING: pglogical_create_subscriber.exe still imports postgres.exe (temporarily non-fatal while crash location is diagnosed)"
          }

      - name: Smoke test
        shell: pwsh
        timeout-minutes: 30
        env:
          PG_ROOT: ${{ steps.install.outputs.pgRoot }}
        run: |
          ./scripts/Test-PgLogical.ps1 `
            -PgRoot "$env:PG_ROOT" `
            -StagingDir "${{ steps.build.outputs.stage }}" `
            -UpstreamVersion "${{ needs.resolve.outputs.version }}" `
            -AllowTemporaryLocalUser

      - name: Record EDB artifact SHA-256 and package ZIP
        id: package
        shell: pwsh
        timeout-minutes: 10
        env:
          ENTRY_JSON: ${{ toJson(matrix.entry) }}
        run: |
          $entry = $env:ENTRY_JSON | ConvertFrom-Json
          # The pinned EDB archive must be in the cache (downloaded by the
          # install step under its exact filename); its SHA-256 is calculated
          # by this project — never a vendor-published checksum.
          $artifactFile = [string]$entry.edbArtifactFilename
          $zip = Get-ChildItem .pg-cache -Filter $artifactFile -File | Select-Object -First 1
          if (-not $zip) { throw "Pinned EDB artifact not found in .pg-cache: $artifactFile" }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $pkgDir = "${{ runner.temp }}/pkg"
          $null = New-Item -ItemType Directory -Force -Path $pkgDir
          $recordFile = Join-Path $pkgDir 'edb-artifact.txt'
          "$hash  $artifactFile" | Set-Content -Path $recordFile -Encoding ascii
          Write-Host "EDB artifact SHA-256 (calculated post-download): $hash ($artifactFile)"

          $zipOut = & ./scripts/Package-PgLogical.ps1 `
            -StagingDir "${{ steps.build.outputs.stage }}" `
            -SourceDir ".build/${{ needs.resolve.outputs.upstreamTag }}/upstream" `
            -PlanEntry $entry `
            -EdbArtifactCalculatedSha256 $hash `
            -OutputDir $pkgDir
          if (-not $zipOut) { throw "Package-PgLogical produced no zip" }
          "zip=$zipOut" >> $env:GITHUB_OUTPUT
          "pkgDir=$pkgDir" >> $env:GITHUB_OUTPUT

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-pg${{ matrix.entry.postgresqlMajor }}
          path: |
            ${{ runner.temp }}/pkg/*.zip
            ${{ runner.temp }}/pkg/SHA256SUMS.txt
            ${{ runner.temp }}/pkg/edb-artifact.txt
          if-no-files-found: error

  publish:
    name: Publish unified release
    needs: [resolve, build]
    if: ${{ !inputs.dryRun && needs.resolve.outputs.planEntriesJson != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      # There is deliberately no matrix here. One publisher owns the immutable
      # tag/release and receives every PostgreSQL-major package artifact.
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: packages-pg*
          path: artifacts
          # Keep each build artifact in its own directory. Every directory
          # contains a package ZIP, a per-package checksum, and EDB provenance;
          # the prepare step combines them deterministically.
          merge-multiple: false

      - name: Prepare and verify unified release assets
        id: prepare
        shell: pwsh
        env:
          PLAN_JSON: ${{ needs.resolve.outputs.planEntriesJson }}
          VERSION: ${{ needs.resolve.outputs.version }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstreamTag }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commitSha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/common.ps1
          $summaryOutput = @(& ./scripts/Prepare-UnifiedReleaseAssets.ps1 `
            -PlanJson $env:PLAN_JSON `
            -ArtifactsRoot 'artifacts' `
            -OutputDirectory 'release-assets' `
            -TemplatePath '.github/release-body-template.md' `
            -Version $env:VERSION `
            -UpstreamRepository (Get-UpstreamRepository) `
            -UpstreamTag $env:UPSTREAM_TAG `
            -CommitSha $env:COMMIT_SHA `
            -RunUrl $env:RUN_URL)
          if (-not $summaryOutput) { throw 'Prepare-UnifiedReleaseAssets produced no summary.' }
          $summary = ($summaryOutput -join "`n") | ConvertFrom-Json
          "releaseTag=$($summary.releaseTag)" >> $env:GITHUB_OUTPUT
          "releaseTitle=$($summary.releaseTitle)" >> $env:GITHUB_OUTPUT
          "assetCount=$($summary.packageCount)" >> $env:GITHUB_OUTPUT

      - name: Check for an existing release (fail closed)
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.releaseTag }}
        run: |
          . ./scripts/common.ps1
          $state = Test-ExistingRelease -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
          if ($state -eq 'absent') {
            'exists=false' >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG does not exist; publication will proceed."
          } else {
            'exists=true' >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG already exists; creation will be skipped after asset verification."
          }

      - name: Verify existing unified release assets
        if: steps.existing.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.releaseTag }}
          PLAN_JSON: ${{ needs.resolve.outputs.planEntriesJson }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release) { throw "Could not read existing release $env:RELEASE_TAG." }
          $actual = @($release.assets | ForEach-Object { [string]$_.name } | Sort-Object)
          $entries = @($env:PLAN_JSON | ConvertFrom-Json)
          $expected = @($entries | ForEach-Object { "pglogical-$($_.pglogicalVersion)-pg$($_.postgresqlMajor)-w$($_.windowsPackagingRevision)-x64.zip" }) + 'SHA256SUMS.txt'
          $expected = @($expected | Sort-Object)
          if (($actual -join '|') -ne ($expected -join '|')) { throw "Existing release $env:RELEASE_TAG has an incomplete or unexpected asset set. Actual: $($actual -join ', '); expected: $($expected -join ', ')." }
          Write-Host "Existing release $env:RELEASE_TAG has the complete unified asset set."

      - name: Create unified release with all package assets
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.releaseTag }}
          RELEASE_TITLE: ${{ steps.prepare.outputs.releaseTitle }}
        run: |
          set -euo pipefail
          # Create the published release WITH every ZIP and the combined
          # checksum in one call. This is required by the repository's
          # immutable-release policy and guarantees one tag -> one release.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --draft \
            --notes-file release-assets/release-body.md \
            release-assets/*.zip release-assets/SHA256SUMS.txt

      - name: Capture created release identity
        if: steps.existing.outputs.exists == 'false'
        id: created
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.releaseTag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $null
          for ($attempt = 0; $attempt -lt 5 -and -not $release; $attempt++) {
            $raw = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0 -and $raw) { $release = $raw | ConvertFrom-Json }
            if (-not $release) { Start-Sleep -Seconds 2 }
          }
          if (-not $release -or -not $release.id) { throw "Could not resolve the release ID for $env:RELEASE_TAG after release creation." }
          'created=true' >> $env:GITHUB_OUTPUT
          "releaseId=$($release.id)" >> $env:GITHUB_OUTPUT
          Write-Host "Captured created release identity: $env:RELEASE_TAG (id $($release.id))"

      - name: Verify unified release assets
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.created.outputs.releaseId }}
          PLAN_JSON: ${{ needs.resolve.outputs.planEntriesJson }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = @(gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json).assets | ForEach-Object { [string]$_.name } | Sort-Object
          $entries = @($env:PLAN_JSON | ConvertFrom-Json)
          $expected = @($entries | ForEach-Object { "pglogical-$($_.pglogicalVersion)-pg$($_.postgresqlMajor)-w$($_.windowsPackagingRevision)-x64.zip" }) + 'SHA256SUMS.txt'
          $expected = @($expected | Sort-Object)
          if (($actual -join '|') -ne ($expected -join '|')) { throw "Created unified release has an unexpected asset set. Actual: $($actual -join ', '); expected: $($expected -join ', ')." }
          Write-Host "Verified $($entries.Count) ZIP assets and one combined SHA256SUMS.txt."

      - name: Generate artifact attestation
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-assets/*.zip

      - name: Publish verified unified release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.releaseTag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify release is published
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.created.outputs.releaseId }}
        shell: bash
        run: |
          set -euo pipefail
          isDraft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')
          echo "isDraft=$isDraft"
          if [ "$isDraft" != "false" ]; then echo "Release is still a draft"; exit 1; fi

      - name: Delete incomplete release on failure (ownership-checked)
        if: ${{ failure() && steps.existing.outputs.exists == 'false' && steps.created.outputs.created == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.releaseTag }}
          RELEASE_ID: ${{ steps.created.outputs.releaseId }}
        run: |
          . ./scripts/common.ps1
          if (-not (Test-ReleaseOwnership -Created '${{ steps.created.outputs.created }}' -ReleaseId $env:RELEASE_ID -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY)) {
            Write-Host "Cleanup ownership cannot be proven for $env:RELEASE_TAG (releaseId '$env:RELEASE_ID'); leaving the release and tag untouched."
            exit 1
          }
          gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw "Failed to delete incomplete release $env:RELEASE_TAG (id $env:RELEASE_ID)." }
          $refDelete = & gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_TAG" 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "Tag ref cleanup skipped (exit $LASTEXITCODE): $refDelete" }
          Write-Host "Deleted incomplete release $env:RELEASE_TAG (id $env:RELEASE_ID) created by this job."

  set-latest:
    # GitHub allows exactly ONE "Latest" release per repository. The single
    # publisher creates one complete unified release, then this job selects
    # that release deterministically and verifies GitHub's latest read-back.
    name: Mark deterministic GitHub Latest
    needs: [resolve, publish]
    if: ${{ !inputs.dryRun && needs.resolve.outputs.planEntriesJson != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reconcile Latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/common.ps1
          $config = Import-VersionConfig
          $majors = @($config.postgresqlMajors | ForEach-Object { [string]$_ })
          # Include assets: only a complete unified release may become Latest.
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[] | {tag_name, draft, prerelease, assets}' | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases for Latest selection.' }
          $tag = Select-LatestRelease -Version $env:VERSION -Majors $majors -Releases $releases
          if (-not $tag) { throw "No complete published unified release found for pglogical $env:VERSION; cannot select Latest." }
          $releaseId = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id'
          if ($LASTEXITCODE -ne 0 -or -not $releaseId) { throw "Could not resolve release ID for $tag." }
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -f make_latest=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not mark $tag as GitHub Latest." }
          $latestTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latestTag -ne $tag) { throw "GitHub Latest read-back returned '$latestTag', expected '$tag'." }
          Write-Host "Marked and verified $tag as the latest release"

  report-failure:
    name: Report build failure
    needs: [resolve, build, publish]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        # gh issue create requires a git repository context even with --repo.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Open issue for failed build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/common.ps1
          $version = '${{ needs.resolve.outputs.version }}'
          $tag = '${{ needs.resolve.outputs.upstreamTag }}'
          $failureMarker = Get-ReleaseFailureMarker -Version $version -UpstreamTag $tag
          $runMarker = "<!-- pglogical-build-failure-run: $env:GITHUB_RUN_ID -->"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          # A rerun keeps the same GITHUB_RUN_ID. Search all existing issues
          # before creating one so a transient create response or a rerun
          # cannot produce duplicate failure issues.
          $rawIssues = @(gh api "repos/$env:GITHUB_REPOSITORY/issues?state=all&per_page=100" --paginate --jq '.[] | {number,state,body}')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing GitHub issues for failure deduplication.' }
          $issues = @($rawIssues | ForEach-Object {
            if ($_ -is [string] -and $_.Trim()) { $_ | ConvertFrom-Json }
          })
          $existing = Find-ExistingReleaseFailureIssue -Issues $issues -Marker $runMarker
          if ($existing) {
            Write-Host "Failure issue already exists for this workflow run: #$($existing.number)"
            exit 0
          }

          $body = @(
            $failureMarker
            $runMarker
            "Build for pglogical $version ($tag) failed."
            ""
            "Workflow run: $runUrl"
          ) -join "`n"
          gh issue create --repo "$env:GITHUB_REPOSITORY" `
            --title "Build failed for pglogical $version ($tag)" `
            --body "$body"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub issue for the failed build.' }

  close-failure-issues:
    name: Reconcile resolved build issues
    needs: [resolve, build, publish]
    if: ${{ !inputs.dryRun && needs.resolve.outputs.planEntriesJson != '[]' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Close resolved automated failure issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/common.ps1
          $version = '${{ needs.resolve.outputs.version }}'
          $tag = '${{ needs.resolve.outputs.upstreamTag }}'
          $failureMarker = Get-ReleaseFailureMarker -Version $version -UpstreamTag $tag
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $rawIssues = @(gh api "repos/$env:GITHUB_REPOSITORY/issues?state=open&per_page=100" --paginate --jq '.[] | {number,body}')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list open GitHub issues for successful-build reconciliation.' }
          $issues = @($rawIssues | ForEach-Object {
            if ($_ -is [string] -and $_.Trim()) { $_ | ConvertFrom-Json }
          })
          $matches = @($issues | Where-Object { [string]$_.body -like "*$failureMarker*" })
          foreach ($issue in $matches) {
            $number = [string]$issue.number
            gh issue comment $number --repo "$env:GITHUB_REPOSITORY" --body "Resolved by successful release workflow: $runUrl"
            if ($LASTEXITCODE -ne 0) { throw "Could not comment on automated failure issue #$number." }
            gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/issues/$number" -f state=closed -f state_reason=completed
            if ($LASTEXITCODE -ne 0) { throw "Could not close automated failure issue #$number." }
            Write-Host "Closed resolved automated failure issue #$number"
          }
