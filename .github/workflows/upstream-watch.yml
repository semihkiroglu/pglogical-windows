# upstream-watch.yml — discovers the latest upstream pglogical release and
# dispatches one pinned release.yml plan for missing upstream-compatible majors.
# A published local release for the same upstream version × major is coverage;
# PostgreSQL minor/EDB revision drift is handled only by compatibility-smoke.
#
# Runs daily on an Ubuntu runner and also reacts to a merged
# .github/pg-versions.json change so a newly configured major is packaged
# without waiting for the next schedule.
#
# We deliberately do NOT listen for upstream release events: external
# repositories cannot deliver events to this workflow, and /releases/latest is
# idempotent and safe to poll.

name: upstream-watch

on:
  push:
    paths:
      - '.github/pg-versions.json'
  schedule:
    # Off-hour daily run; deliberately not minute zero to avoid load spikes.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write    # dispatch release.yml

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Upstream discovery: query /releases/latest and compute the build plan.
  # ---------------------------------------------------------------------------
  discover:
    name: Discover latest upstream release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      planCount: ${{ steps.plan.outputs.planCount }}
      planJson: ${{ steps.plan.outputs.planJson }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compute build plan
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pg-versions-sync.yml runs as a separate workflow, so the checkout is
          # already current; no re-checkout dance needed here.
          ./scripts/Get-UpstreamReleases.ps1 -OutputFile release-plan.json
          $plan = Get-Content release-plan.json -Raw | ConvertFrom-Json
          "planCount=$($plan.plan.Count)" >> $env:GITHUB_OUTPUT
          # Store the JSON for the notify job
          $planJson = ($plan | ConvertTo-Json -Depth 6 -Compress)
          "planJson<<EOF" >> $env:GITHUB_OUTPUT
          $planJson >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Upload build plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error

      - name: Summarize
        shell: pwsh
        run: |
          $plan = Get-Content release-plan.json -Raw | ConvertFrom-Json
          if ($plan.plan.Count -eq 0) {
            Write-Host 'Latest upstream release is already fully packaged. Nothing to do.'
            return
          }
          foreach ($p in $plan.plan) {
            Write-Host "MISSING: $($p.pglogicalVersion) ($($p.upstreamTag) @ $($p.upstreamCommitSha)) -> $($p.localTag) [EDB $($p.edbArtifactFilename)]"
          }

  # ---------------------------------------------------------------------------
  # Dispatch: trigger ONE release.yml run with the complete pinned plan.
  # ---------------------------------------------------------------------------
  dispatch:
    name: Dispatch release build with pinned plan
    needs: discover
    if: ${{ !cancelled() && needs.discover.outputs.planCount != '0' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download build plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-plan

      - name: Dispatch one release workflow with the pinned plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $plan = Get-Content release-plan.json -Raw | ConvertFrom-Json
          $entriesJson = @($plan.plan) | ConvertTo-Json -Compress -Depth 6
          Write-Host "Dispatching one release.yml run with $($plan.plan.Count) pinned plan entr(ies)"
          gh workflow run release.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref $env:GITHUB_REF_NAME `
            -f planJson="$entriesJson" `
            -f dryRun=false
          if ($LASTEXITCODE -ne 0) { throw 'gh workflow run failed to dispatch the pinned release plan' }
          Write-Host 'Dispatched. release.yml validates the whole plan, verifies every pinned EDB URL, and builds the exact pinned artifacts.'
